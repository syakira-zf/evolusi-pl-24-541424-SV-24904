name: Glowithsya Frontend CI/CD

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"

  pull_request:
    branches:
      - main
      - dev

jobs:

  # =========================================================
  # 1. LINT
  # =========================================================
  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint


  # =========================================================
  # 2. TEST
  # =========================================================
  test:
    name: Frontend Test
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --run


  # =========================================================
  # 3. BUILD
  # =========================================================
  build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_URL: http://127.0.0.1:8000/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vue application
        run: npm run build

      - name: Show dist contents
        run: |
          echo "Isi folder dist:"
          find dist -maxdepth 2 -type f -print

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error


  # =========================================================
  # 4. DEPLOY
  # =========================================================
  deploy:
    name: Frontend Deploy
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Show deployed dist contents
        run: |
          echo "Build artifact diterima dari job Build."
          echo "Isi folder dist:"
          find dist -maxdepth 2 -type f -print

      - name: Deploy frontend
        run: |
          echo "Frontend deployment simulation successful."